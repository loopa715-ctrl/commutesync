databases:
  - name: commutesync-db
    plan: free

services:
  - type: web
    name: commutesync
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: COMMUTESYNC_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: commutesync-db
          property: connectionString
