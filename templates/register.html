{% extends "base.html" %}
{% block title %}Register - CommuteSync{% endblock %}
{% block content %}
<section class="form-section">
    <div class="form-container">
        <h1>Create Account 🚗</h1>
        <p>Join CommuteSync today</p>
        <form method="POST">
            <label for="name">Full Name</label>
            <input id="name" type="text" name="name" value="{{ form.get('name', '') }}"
                   placeholder="Enter your full name" required>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ form.get('email', '') }}"
                   placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   placeholder="Create a password (min 6 characters)" minlength="6" required>
            <button type="submit">Create Account</button>
        </form>
        <p class="form-footer">Already have an account?
            <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</section>
{% endblock %}
