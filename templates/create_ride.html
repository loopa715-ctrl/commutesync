{% extends "base.html" %}
{% block title %}Create Ride - CommuteSync{% endblock %}
{% block content %}
<section class="form-section">
    <div class="form-container">
        <h1>Create a Ride 🚗</h1>
        <p>Share your journey with other commuters.</p>
        <form method="POST">
            <label for="pickup">Pickup Location</label>
            <input id="pickup" type="text" name="pickup" value="{{ form.get('pickup', '') }}"
                   placeholder="Enter pickup location" required>
            <label for="destination">Destination</label>
            <input id="destination" type="text" name="destination"
                   value="{{ form.get('destination', '') }}" placeholder="Enter destination" required>
            <label for="ride_date">Ride Date</label>
            <input id="ride_date" type="date" name="ride_date" min="{{ today }}"
                   value="{{ form.get('ride_date', '') }}" required>
            <label for="ride_time">Ride Time</label>
            <input id="ride_time" type="time" name="ride_time"
                   value="{{ form.get('ride_time', '') }}" required>
            <label for="seats">Available Seats</label>
            <input id="seats" type="number" name="seats" min="1" max="10"
                   value="{{ form.get('seats', '') }}" placeholder="Number of seats" required>
            <label for="fare">Fare per Passenger (₹)</label>
            <input id="fare" type="number" name="fare" min="0" step="0.01"
                   value="{{ form.get('fare', '') }}" placeholder="Enter fare" required>
            <button type="submit">Create Ride</button>
        </form>
        <p class="form-footer"><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
    </div>
</section>
{% endblock %}
